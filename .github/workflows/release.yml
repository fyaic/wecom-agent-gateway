name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  provenance-release:
    name: provenance-release
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Verify tagged source and release notes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
          pnpm install --frozen-lockfile
          pnpm run ci
          pnpm run public:history-check

      - name: Create reproducible source archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          archive="wecom-agent-gateway-${GITHUB_REF_NAME}.tar.gz"
          git archive \
            --format=tar \
            --prefix="wecom-agent-gateway-${GITHUB_REF_NAME}/" \
            "${GITHUB_SHA}" | gzip -n > "${archive}"
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Attest source archive provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "wecom-agent-gateway-${{ github.ref_name }}.tar.gz"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="wecom-agent-gateway-${GITHUB_REF_NAME}.tar.gz"
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME} — Public Preview" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            "${archive}" \
            "${archive}.sha256"
